<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Timers</title>
</head>
<body>

    <h1>JavaScript Timers</h1>

    <!-- setTimeout -->
    <h2>setTimeout()</h2>

    <button id="timeoutButton">
        Start Timeout
    </button>

    <button id="cancelTimeoutButton">
        Cancel Timeout
    </button>

    <p id="timeoutOutput"></p>


    <!-- setInterval -->
    <h2>setInterval()</h2>

    <button id="startIntervalButton">
        Start Interval
    </button>

    <button id="stopIntervalButton">
        Stop Interval
    </button>

    <p id="intervalOutput"></p>


    <!-- Counter -->
    <h2>Timer Counter</h2>

    <p id="counter">0</p>

    <button id="startCounterButton">
        Start
    </button>

    <button id="stopCounterButton">
        Stop
    </button>

    <button id="resetCounterButton">
        Reset
    </button>


    <!-- Countdown -->
    <h2>Countdown</h2>

    <p id="countdown">10</p>

    <button id="startCountdownButton">
        Start Countdown
    </button>

    <button id="resetCountdownButton">
        Reset Countdown
    </button>


    <!-- Digital Clock -->
    <h2>Digital Clock</h2>

    <h3 id="clock">00:00:00</h3>


    <!-- Delayed Message -->
    <h2>Delayed Message</h2>

    <button id="messageButton">
        Show Message
    </button>

    <p id="messageOutput"></p>


    <script src="Timers.js"></script>

</body>
</html>
