<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript DOM</title>
</head>

<body>

    <h1 id="mainHeading">Hello JavaScript</h1>

    <p id="message">
        This paragraph will be controlled by JavaScript.
    </p>

    <button id="changeButton">
        Change Text
    </button>

    <hr>

    <h2 class="title">First Title</h2>
    <h2 class="title">Second Title</h2>

    <div id="container">
        <p>Paragraph inside container.</p>
    </div>

    <hr>

    <input
        id="nameInput"
        type="text"
        placeholder="Enter your name"
    >

    <p id="output"></p>

    <hr>

    <div id="box">
        Original Content
    </div>

    <script src="DOM.js"></script>

</body>
</html>
