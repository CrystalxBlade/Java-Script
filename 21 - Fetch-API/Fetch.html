<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fetch API</title>
</head>
<body>

    <h1>Fetch API</h1>

    <section>

        <h2>GET Request</h2>

        <button id="getButton">
            Get Data
        </button>

        <p id="getStatus"></p>

        <pre id="getOutput"></pre>

    </section>

    <hr>

    <section>

        <h2>POST Request</h2>

        <button id="postButton">
            Send Data
        </button>

        <pre id="postOutput"></pre>

    </section>

    <hr>

    <section>

        <h2>PUT Request</h2>

        <button id="putButton">
            Update Data
        </button>

        <pre id="putOutput"></pre>

    </section>

    <hr>

    <section>

        <h2>DELETE Request</h2>

        <button id="deleteButton">
            Delete Data
        </button>

        <p id="deleteOutput"></p>

    </section>

    <hr>

    <section>

        <h2>Async/Await Example</h2>

        <button id="asyncButton">
            Fetch with Async/Await
        </button>

        <pre id="asyncOutput"></pre>

    </section>

    <script src="Fetch.js"></script>

</body>
</html>
