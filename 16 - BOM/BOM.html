<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript BOM</title>
</head>
<body>

    <h1>JavaScript BOM</h1>

    <!-- Window -->
    <h2>Window</h2>

    <button id="windowButton">
        Show Window Information
    </button>

    <p id="windowOutput"></p>


    <!-- Browser Dimensions -->
    <h2>Browser Dimensions</h2>

    <p id="dimensionsOutput"></p>


    <!-- Location -->
    <h2>Location</h2>

    <button id="locationButton">
        Show Current URL
    </button>

    <p id="locationOutput"></p>


    <!-- Navigator -->
    <h2>Navigator</h2>

    <button id="navigatorButton">
        Show Browser Information
    </button>

    <p id="navigatorOutput"></p>


    <!-- Screen -->
    <h2>Screen</h2>

    <button id="screenButton">
        Show Screen Information
    </button>

    <p id="screenOutput"></p>


    <!-- Dialogs -->
    <h2>Browser Dialogs</h2>

    <button id="alertButton">
        Alert
    </button>

    <button id="confirmButton">
        Confirm
    </button>

    <button id="promptButton">
        Prompt
    </button>

    <p id="dialogOutput"></p>


    <!-- History -->
    <h2>Browser History</h2>

    <button id="backButton">
        Back
    </button>

    <button id="forwardButton">
        Forward
    </button>


    <!-- Scroll -->
    <h2>Scroll Information</h2>

    <button id="scrollButton">
        Show Scroll Position
    </button>

    <p id="scrollOutput"></p>


    <!-- Online Status -->
    <h2>Network Status</h2>

    <p id="networkOutput"></p>


    <script src="BOM.js"></script>

</body>
</html>
